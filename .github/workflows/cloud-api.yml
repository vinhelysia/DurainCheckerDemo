name: Cloud API and RLS
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: durian_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest backend.test_app -v
      - name: Check database permissions in disposable PostgreSQL
        env:
          PGPASSWORD: test-only
        run: |
          python - <<'PY'
          from pathlib import Path
          setup, assertions = Path('supabase/test_rls.sql').read_text().split('-- ASSERTIONS')
          migration = Path('supabase/migrations/202609260001_cloud_ledger.sql').read_text()
          Path('/tmp/check.sql').write_text(setup + migration + assertions)
          PY
          psql -h localhost -U postgres -d durian_test -v ON_ERROR_STOP=1 -f /tmp/check.sql
